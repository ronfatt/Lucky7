<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A12"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Compass / Bagua Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>

  <!-- North-South Axes -->
  <line x1="256" y1="60" x2="256" y2="452" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="60" y1="256" x2="452" y2="256" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Center Glow Icon: "7" with Star -->
  <g filter="url(#glow)">
    <path d="M190 170 L330 170 L250 350 L200 350 L270 196 L190 196 Z" fill="url(#goldGrad)"/>
    <circle cx="256" cy="140" r="12" fill="#FDE047"/>
  </g>
</svg>
